services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clearance_scout}
      POSTGRES_USER: ${POSTGRES_USER:-clearance_scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearance_scout}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scanner:
    build:
      context: .
      dockerfile: scanner/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clearance_scout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clearance_scout}
      RETAILERS: ${RETAILERS:-home_depot}
      ZIP_CODE: ${ZIP_CODE}
      RADIUS_MILES: ${RADIUS_MILES:-25}
      WATCHED_DEPARTMENTS: ${WATCHED_DEPARTMENTS:-}
      WATCH_KEYWORDS: ${WATCH_KEYWORDS:-}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-240}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - browser-profile:/data/browser-profile
    ports:
      # noVNC direct — optional fallback for debugging without going
      # through the dashboard's embedded Browser tab (see `web`, below).
      # Bind to localhost and reach it over an SSH tunnel; never publish
      # this on a public interface, it can drive a live authenticated
      # browser with no auth of its own.
      - "127.0.0.1:${NOVNC_PORT:-6901}:6901"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clearance_scout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clearance_scout}
      SCANNER_INTERNAL_URL: http://scanner:8090
      SCANNER_NOVNC_HOST: scanner:6901
    ports:
      # No auth in front of this yet (see README) — fine for an
      # internal-only deployment. Its /vnc/* routes proxy through to a live
      # authenticated browser session with no login of their own, so don't
      # publish this beyond your LAN until that's addressed.
      - "${WEB_PORT:-8000}:8000"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clearance_scout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clearance_scout}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      SCANNER_INTERNAL_URL: http://scanner:8090
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8000}
    volumes:
      - bot-state:/data
    profiles: ["telegram"]   # `docker compose --profile telegram up -d` to include it; omit for dashboard-only

volumes:
  db-data:
  browser-profile:
  bot-state:
