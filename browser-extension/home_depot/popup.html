<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clearance Scout</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 13px; }
    .row span:first-child { color: #666; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.ok { background: #e6f4ea; color: #1f8a4c; }
    .badge.bad { background: #fdecea; color: #c0392b; }
    a.dashboard-link {
      display: block; margin-top: 12px; text-align: center; padding: 8px;
      background: #e56a1f; color: white; border-radius: 8px; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🛒 Clearance Scout</h1>
  <div class="row"><span>Backend</span><span id="backend-status" class="badge">checking…</span></div>
  <div class="row"><span>Scanner</span><span id="scanner-state">—</span></div>
  <div class="row"><span>Last scan</span><span id="last-scan">—</span></div>
  <a class="dashboard-link" id="dashboard-link" href="#" target="_blank">Open dashboard</a>
  <script src="popup.js"></script>
</body>
</html>
